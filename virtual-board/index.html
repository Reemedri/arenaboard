<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ArenaBoard Virtual</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background:
        radial-gradient(ellipse at top, #2a2520 0%, #15110d 50%, #0a0806 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      padding: 40px 20px;
      position: relative;
    }
    /* subtle wall texture */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,0.015) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(255,100,50,0.02) 0%, transparent 40%);
      pointer-events: none;
      z-index: 0;
    }
    /* wood shelf under the board */
    body::after {
      content: '';
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 120px;
      background: linear-gradient(180deg, transparent 0%, #1a1410 30%, #0e0a07 100%);
      pointer-events: none;
      z-index: 0;
    }
    .wall-label {
      position: relative; z-index: 2;
      font-size: 10px; color: #3a332c; letter-spacing: 0.3em;
      margin-bottom: 24px; text-transform: uppercase;
    }
    /* Frame — matte black bezel like real IoT display */
    .frame {
      position: relative; z-index: 2;
      background: linear-gradient(135deg, #0d0d0f 0%, #141418 100%);
      border: 1px solid #2a2a32;
      border-radius: 10px;
      padding: 24px 26px 22px;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.04),
        inset 0 -1px 0 rgba(0,0,0,0.6),
        0 30px 60px rgba(0,0,0,0.8),
        0 60px 120px rgba(255,80,30,0.08);
    }
    /* Bezel brand label */
    .frame::before {
      content: 'ARENABOARD';
      position: absolute;
      bottom: 6px; left: 50%;
      transform: translateX(-50%);
      font-size: 7px;
      letter-spacing: 0.35em;
      color: #2a2a32;
      font-weight: 700;
    }
    /* Power LED on bezel */
    .frame::after {
      content: '';
      position: absolute;
      top: 10px; right: 14px;
      width: 4px; height: 4px;
      border-radius: 50%;
      background: #ff2a1a;
      box-shadow: 0 0 6px #ff2a1a;
      animation: led-pulse 2s infinite;
    }
    @keyframes led-pulse {
      0%,100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    canvas { display: block; image-rendering: pixelated; border-radius: 3px; }
    .status-row {
      position: relative; z-index: 2;
      margin-top: 20px;
      display: flex; gap: 20px; align-items: center;
      font-size: 10px; letter-spacing: 0.15em;
    }
    .status { color: #3a332c; }
    .status.connected { color: #1D9E75; }
    .status.error { color: #E24B4A; }
    .status.connected::before { content: '● '; }
    .status.error::before { content: '○ '; }
    .dot-sep { color: #2a2520; }
    .log {
      position: relative; z-index: 2;
      margin-top: 6px; font-size: 9px; color: #2a2520;
      max-height: 40px; overflow-y: auto; width: 100%;
      max-width: 768px; text-align: center;
    }
    .log div { padding: 1px 0; }
    /* Screen glow — soft backlight effect */
    .frame {
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.04),
        inset 0 -1px 0 rgba(0,0,0,0.6),
        0 30px 60px rgba(0,0,0,0.8),
        0 0 80px rgba(255,80,30,0.05);
    }
  </style>
</head>

// gamma 2.2
const GAMMA=[]
for(let i=0;i<256;i++) GAMMA[i]=Math.round(Math.pow(i/255,2.2)*255)
function gc(hex) {
  if(!hex||hex[0]!=='#'||hex.length<7) return hex||'#000'
  return `rgb(${GAMMA[parseInt(hex.slice(1,3),16)||0]},${GAMMA[parseInt(hex.slice(3,5),16)||0]},${GAMMA[parseInt(hex.slice(5,7),16)||0]})`
}
function hexRgb(hex) {
  if(!hex||hex[0]!=='#') return {r:0,g:0,b:0}
  return {r:parseInt(hex.slice(1,3),16)||0,g:parseInt(hex.slice(3,5),16)||0,b:parseInt(hex.slice(5,7),16)||0}
}
function dimHex(hex,f) {
  const {r,g,b}=hexRgb(hex)
  return `#${Math.floor(r*f).toString(16).padStart(2,'0')}${Math.floor(g*f).toString(16).padStart(2,'0')}${Math.floor(b*f).toString(16).padStart(2,'0')}`
}

const LAYERS=4
let layers=Array.from({length:LAYERS},()=>Array.from({length:ROWS},()=>Array(COLS).fill(null)))
function clearLayer(l){for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)layers[l][r][c]=null}
function px(l,x,y,col){if(x>=0&&x<COLS&&y>=0&&y<ROWS)layers[l][y][x]=col}
function composite(){
  const out=Array.from({length:ROWS},()=>Array(COLS).fill(null))
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)
    for(let l=LAYERS-1;l>=0;l--){if(layers[l][r][c]){out[r][c]=layers[l][r][c];break}}
  return out
}

function sChar(l,ch,x,y,col){
  const g=SF[ch.toUpperCase()];if(!g)return x+4
  for(let r=0;r<5;r++)for(let c=0;c<g[r].length;c++)if(g[r][c])px(l,x+c,y+r,col)
  return x+g[0].length+1
}
function sTxt(l,str,x,y,col){let cx=x;for(const ch of str)cx=sChar(l,ch,cx,y,col);return cx}
function sTxtW(str){let w=0;for(const ch of str){const g=SF[ch.toUpperCase()];w+=g?g[0].length+1:4}return w}
function sTxtC(l,str,y,col,x0=0,x1=COLS){const x=x0+Math.floor((x1-x0-sTxtW(str))/2);sTxt(l,str,x,y,col)}

function mChar(l,ch,x,y,col){
  const g=MF[ch];if(!g)return x+6
  for(let r=0;r<7;r++)for(let c=0;c<g[r].length;c++)if(g[r][c])px(l,x+c,y+r,col)
  return x+g[0].length+1
}
function mTxt(l,str,x,y,col){let cx=x;for(const ch of str)cx=mChar(l,ch,cx,y,col);return cx}
function mTxtW(str){let w=0;for(const ch of str){const g=MF[ch];w+=g?g[0].length+1:6}return w}
function mTxtC(l,str,y,col,x0=0,x1=COLS){const tw=mTxtW(str);const x=x0+Math.floor((x1-x0-tw)/2);mTxt(l,str,x,y,col)}

function lChar(l,ch,x,y,col){
  const g=LF[ch];if(!g)return x+5
  for(let r=0;r<12;r++)for(let c=0;c<g[r].length;c++)if(g[r][c])px(l,x+c,y+r,col)
  return x+g[0].length+1
}
function lTxt(l,str,x,y,col){let cx=x;for(const ch of str)cx=lChar(l,ch,cx,y,col);return cx}
function lTxtW(str){let w=0;for(const ch of str){const g=LF[ch];w+=g?g[0].length+1:5}return w}
function lTxtC(l,str,y,col,x0=0,x1=COLS){
  const tw=lTxtW(str);const x=x0+Math.floor((x1-x0-tw)/2);lTxt(l,str,x,y,col)
}

function hLine(l,y,col){for(let c=0;c<COLS;c++)px(l,c,y,col)}
function vLine(l,x,y0,y1,col){for(let r=y0;r<=y1;r++)px(l,x,r,col)}
function fillRect(l,x,y,w,h,col){for(let r=y;r<y+h&&r<ROWS;r++)for(let c=x;c<x+w&&c<COLS;c++)px(l,c,r,col)}
function drawBox(l,x,y,w,h,col){
  for(let c=x;c<x+w;c++){px(l,c,y,col);px(l,c,y+h-1,col)}
  for(let r=y;r<y+h;r++){px(l,x,r,col);px(l,x+w-1,r,col)}
}

function drawLogo(abbr, x, y) {
  const logo = LOGOS[abbr]
  if(!logo) {
    sTxtC(1, abbr.substring(0,3), y+7, '#ffffff', x, x+20)
    return
  }
  for(let r=0;r<20;r++) for(let c=0;c<20;c++) {
    const v=logo.pixels[r][c]
    if(v) px(1,x+c,y+r,logo.colors[String(v)])
  }
}

function drawAmbient(){
  clearLayer(0)
  const t=ambientFrame*0.02
  const hr=hexRgb(homeColor),ar=hexRgb(awayColor)
  for(let c=0;c<COLS;c++){
    const wave=Math.sin(t+c*0.15)*0.5+0.5
    const intensity=0.025+wave*0.025
    const s=c/COLS
    const r=Math.round((ar.r*(1-s)+hr.r*s)*intensity)
    const g=Math.round((ar.g*(1-s)+hr.g*s)*intensity)
    const b=Math.round((ar.b*(1-s)+hr.b*s)*intensity)
    if(r>1||g>1||b>1){
      const col=`#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`
      for(let row=0;row<ROWS;row++)px(0,c,row,col)
    }
  }
}

function drawUI(){
  clearLayer(1)
  const isFinal=state.status==='STATUS_FINAL'

  // ── top labels (row 1) ──
  sTxtC(1,'AWAY',1,'#ffffff',AX0,AX1+1)
  sTxtC(1,'HOME',1,'#ffffff',HX0,HX1+1)

  // ── dividers ──
  vLine(1,DL,0,ROWS-8,'#222222')
  vLine(1,DR,0,ROWS-8,'#222222')

  // ── side boxes — taller to fit logo + score stacked ──
  drawBox(1,AX0,7,AX1-AX0+1,40,'#222222')
  drawBox(1,CX0,7,CX1-CX0+1,40,'#222222')
  drawBox(1,HX0,7,HX1-HX0+1,40,'#222222')

  // ── logos — Y pushed down 2px (was 9 → 11) for buffer from AWAY/HOME ──
  const logoY=11
  drawLogo(state.away_team, AX0+10, logoY)
  drawLogo(state.home_team, HX0+10, logoY)

  // ── scores — shifted toward center edge + pushed down 2px (was 15 → 34) ──
  // placed BELOW the logo instead of overlapping it
  lTxtC(1,String(state.away_score),34,'#ffffff',AX0+1,AX1)
  lTxtC(1,String(state.home_score),34,'#ffffff',HX0+1,HX1)

  // ── clock — medium font (unchanged Y) — color from config ──
  mTxtC(1,state.clock,11,config.clock_color,CX0+1,CX1)

  // ── QTR label — bright yellow for contrast (was #333333) ──
  sTxtC(1,'QTR',21,'#FFD400',CX0+1,CX1)

  // ── period number — bold, bright, centered ──
  const pStr=isFinal?'FNL':String(state.period)
  const pCol=isFinal?'#ff4444':'#FFD400'
  mTxtC(1,pStr,27,pCol,CX0+1,CX1)

  // ── shot clock — green, 1px gap below period — toggleable via config ──
  if(config.show_shot_clock){
    const shotStr=state.shot_clock!=null?String(state.shot_clock).padStart(2,'0'):'24'
    mTxtC(1,shotStr,37,'#44dd66',CX0+1,CX1)
  }

  // ── separator above team names ──
  hLine(1,47,'#1a1a1a')

  // ── team abbreviations — pushed down to row 50 (was 40), closer to ticker ──
  sTxtC(1,state.away_team.substring(0,3),50,awayColor,AX0,AX1+1)
  sTxtC(1,state.home_team.substring(0,3),50,homeColor,HX0,HX1+1)

  // ── center mini-divider (replaces unreadable PPG APG RPG) ──
  px(1,CX0+Math.floor((CX1-CX0)/2)-4,51,'#222')
  px(1,CX0+Math.floor((CX1-CX0)/2),51,'#222')
  px(1,CX0+Math.floor((CX1-CX0)/2)+4,51,'#222')

  // ── ticker — pushed to row 57 — toggleable via config ──
  if(scrollText && config.show_ticker){
    sTxt(1,scrollText,Math.floor(scrollX),57,'#ffffff')
  }
}

function drawIdleSplash(){
  // Idle screen: shown when boardMode==='idle' (no live games, no recent final).
  // Layer 0 (ambient) keeps running underneath so the screen still feels alive in team colors.
  clearLayer(1)

  // Power LED dot in top-right (echoes the physical bezel LED — visual continuity)
  const ledOn = Math.floor(pulseFrame/30) % 2 === 0
  const ledCol = ledOn ? '#ff2222' : '#330000'
  px(1,126,1,ledCol); px(1,127,1,ledCol)
  px(1,126,2,ledCol); px(1,127,2,ledCol)

  // "ARENABOARD" — small font scaled 2x2, centered, in accent color with subtle breathing pulse
  const brandStr='ARENABOARD'
  const accent=config.accent_color||'#ff5500'
  const accentRgb=hexRgb(accent)
  const pulse=(Math.sin(pulseFrame*0.04)+1)/2  // 0..1, slow ~3s cycle
  const bright=0.55+pulse*0.45                  // 0.55..1.0
  const br=Math.round(accentRgb.r*bright)
  const bg=Math.round(accentRgb.g*bright)
  const bb=Math.round(accentRgb.b*bright)
  const brandCol=`#${br.toString(16).padStart(2,'0')}${bg.toString(16).padStart(2,'0')}${bb.toString(16).padStart(2,'0')}`

  // Width at 2x: each char is (font_w * 2) + 2px gap; remove final gap
  let totalW=0
  for(const ch of brandStr){const G=SF[ch];if(G)totalW+=G[0].length*2+2}
  totalW-=2
  let cx=Math.floor((COLS-totalW)/2)
  const cy=16
  for(const ch of brandStr){
    const G=SF[ch];if(!G){cx+=8;continue}
    for(let r=0;r<5;r++)for(let c=0;c<G[r].length;c++)if(G[r][c]){
      // draw 2x2 block per font pixel
      px(1,cx+c*2,  cy+r*2,  brandCol)
      px(1,cx+c*2+1,cy+r*2,  brandCol)
      px(1,cx+c*2,  cy+r*2+1,brandCol)
      px(1,cx+c*2+1,cy+r*2+1,brandCol)
    }
    cx+=G[0].length*2+2
  }

  // Subtitle line — dim
  sTxtC(1,'NO LIVE GAMES',36,'#333333')

  // Decorative team-color sweep across rows 50-51 (slow horizontal pulse from team colors)
  const sweep=(ambientFrame*0.5)%COLS
  for(let c=0;c<COLS;c++){
    const dist=Math.min(Math.abs(c-sweep),COLS-Math.abs(c-sweep))
    if(dist<22){
      const intensity=(1-dist/22)*0.55
      const baseRgb=hexRgb(c>=COLS/2?homeColor:awayColor)
      const r2=Math.round(baseRgb.r*intensity)
      const g2=Math.round(baseRgb.g*intensity)
      const b2=Math.round(baseRgb.b*intensity)
      if(r2+g2+b2>3){
        const col=`#${r2.toString(16).padStart(2,'0')}${g2.toString(16).padStart(2,'0')}${b2.toString(16).padStart(2,'0')}`
        px(1,c,50,col); px(1,c,51,col)
      }
    }
  }
}

function drawHUD(){
  clearLayer(2)
  if(state.status==='STATUS_IN_PROGRESS'){
    const on=Math.floor(pulseFrame/15)%2===0
    const col=on?'#ff2222':'#440000'
    px(2,124,0,col);px(2,125,0,col)
    px(2,124,1,col);px(2,125,1,col)
    px(2,126,0,col);px(2,127,0,col)
    px(2,126,1,col);px(2,127,1,col)
    sTxtC(2,'LIVE',1,on?'#ff3333':'#660000',CX0,CX1+1)
  }
}

function spawnParticles(x,y,color,count=30){
  for(let i=0;i<count;i++){
    particles.push({
      x,y,
      vx:(Math.random()-0.5)*4,
      vy:-(Math.random()*4+1),
      color,
      life:30+Math.floor(Math.random()*25),
      maxLife:55
    })
  }
}

function updateParticles(){
  clearLayer(3)
  particles=particles.filter(p=>p.life>0)
  for(const p of particles){
    p.x+=p.vx;p.vy+=0.12;p.y+=p.vy;p.life--
    const alpha=p.life/p.maxLife
    px(3,Math.floor(p.x),Math.floor(p.y),alpha>0.5?p.color:dimHex(p.color,alpha*2))
  }
}

function applyFlash(){
  if(!flashActive)return
  flashFrame++
  const alpha=Math.max(0,1-flashFrame/12)
  if(alpha<=0){flashActive=false;flashFrame=0;return}
  const val=Math.floor(alpha*200)
  const h=val.toString(16).padStart(2,'0')
  const col=`#${h}${h}${h}`
  for(let r=0;r<47;r++)for(let c=0;c<COLS;c++)if(layers[1][r][c])layers[3][r][c]=col
}

function render(buf){
  ctx.fillStyle='#000'
  ctx.fillRect(0,0,canvas.width,canvas.height)
  const sx=shakeFrames>0?shakeX:0
  const sy=shakeFrames>0?shakeY:0
  const bMul=Math.max(0.1,config.brightness/100)  // brightness 0-100 → 0.1-1.0 multiplier
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const col=buf[r][c]
      const cx=c*PW+PW/2+sx
      const cy=r*PH+PH/2+sy
      if(col){
        const rgb=hexRgb(col)
        const rr=Math.floor(rgb.r*bMul), gg=Math.floor(rgb.g*bMul), bb=Math.floor(rgb.b*bMul)
        if((rr+gg+bb)/3>60){
          ctx.fillStyle=`rgba(${rr},${gg},${bb},0.1)`
          ctx.beginPath();ctx.arc(cx,cy,PW*0.85,0,Math.PI*2);ctx.fill()
        }
        // gamma-correct the dimmed color
        ctx.fillStyle=`rgb(${GAMMA[rr]},${GAMMA[gg]},${GAMMA[bb]})`
        ctx.beginPath();ctx.arc(cx,cy,PW*0.42,0,Math.PI*2);ctx.fill()
      } else {
        ctx.fillStyle='#0c0c0c'
        ctx.beginPath();ctx.arc(cx,cy,PW*0.1,0,Math.PI*2);ctx.fill()
      }
    }
  }
}

setInterval(()=>{
  pulseFrame++;ambientFrame++
  if(shakeFrames>0){
    shakeFrames--;shakeX=(Math.random()-0.5)*5;shakeY=(Math.random()-0.5)*4
    if(shakeFrames===0){shakeX=0;shakeY=0}
  }
  if(scrollText){
    scrollX-=0.6
    if(scrollX<-sTxtW(scrollText))scrollX=COLS
  }
  drawAmbient()
  // Auto-flip from 'final' back to 'idle' after the 5-minute final-score window expires
  if(boardMode==='final' && Date.now() >= finalUntil) boardMode='idle'
  if(boardMode==='idle'){
    drawIdleSplash()
  } else {
    drawUI()
    drawHUD()
  }
  updateParticles();applyFlash()
  render(composite())
},50)

function triggerCelebration(side,color){
  const pack=config.animation_pack||'confetti'
  const x=side==='home'?108:20

  // Every pack: shake slightly. Minimal pack = no shake.
  if(pack!=='minimal') shakeFrames=8

  if(pack==='confetti'){
    // classic — multicolor burst
    flashActive=true;flashFrame=0
    spawnParticles(x,34,color,30)
    spawnParticles(x,34,'#ffffff',10)
    spawnParticles(x,34,awayColor===color?homeColor:awayColor,8)
  }
  else if(pack==='fireworks'){
    // radial explosion — particles in a ring pattern, more dramatic
    flashActive=true;flashFrame=0
    for(let i=0;i<40;i++){
      const angle=(i/40)*Math.PI*2
      const speed=3+Math.random()*2
      particles.push({
        x,y:34,
        vx:Math.cos(angle)*speed,
        vy:Math.sin(angle)*speed-0.5,
        color,life:40+Math.floor(Math.random()*20),maxLife:60
      })
    }
    spawnParticles(x,34,'#ffffff',10)
  }
  else if(pack==='flash'){
    // full-screen strobe only, minimal particles
    flashActive=true;flashFrame=0
    shakeFrames=4
    spawnParticles(x,34,color,6)
  }
  else if(pack==='minimal'){
    // just a small pulse on the score — no flash, no shake, minimal particles
    flashActive=false
    spawnParticles(x,34,color,4)
  }
}

function log(msg){
  const d=document.getElementById('log')
  const el=document.createElement('div')
  el.textContent=`[${new Date().toLocaleTimeString()}] ${msg}`
  d.prepend(el)
  if(d.children.length>10)d.removeChild(d.lastChild)
}

const DEVICE_UID='demo-device-001'  // will come from NVS on real ESP32

const CFG = window.ARENABOARD_CONFIG || {
  SERVER: 'http://localhost:3001',
  WS_PROTOCOL: 'ws',
}
const WS_URL = `${CFG.WS_PROTOCOL}://${CFG.SERVER.replace(/^https?:\/\//, '')}/?uid=${DEVICE_UID}&role=board`

function connect(){
  const ws=new WebSocket(WS_URL)
  const statusEl=document.getElementById('status')
  ws.onopen=()=>{
    statusEl.textContent='ARENABOARD — CONNECTED'
    statusEl.className='status connected'
    log('Connected')
  }
  ws.onmessage=(e)=>{
    const msg=JSON.parse(e.data)

    // Protocol version guard (from master doc section 9)
    if(msg.v && msg.v !== 1){
      log(`Protocol mismatch v${msg.v}`)
      return
    }

    if(msg.type==='FULL_STATE'||msg.type==='SCORE_UPDATE'){
      state={...state,...msg.data}
      if(msg.data.home_color)homeColor=msg.data.home_color
      if(msg.data.away_color)awayColor=msg.data.away_color
      // Real game data → leave idle splash. STATUS_FINAL = freeze final score for 5 min before idling.
      if(state.status==='STATUS_IN_PROGRESS'){
        boardMode='live'
      } else if(state.status==='STATUS_FINAL'){
        if(boardMode!=='final'){
          finalUntil=Date.now()+5*60*1000
          log('Game over — final stays 5 min')
        }
        boardMode='final'
      }
    }
    else if(msg.type==='NO_GAMES'){
      // Server reports zero live games. Keep showing final if we just ended one (within 5 min window),
      // otherwise flip to idle splash.
      if(boardMode==='final' && Date.now() < finalUntil){
        log('No games — keeping final visible')
      } else {
        boardMode='idle'
        log('Idle splash')
      }
    }
    else if(msg.type==='CONFIG_FULL'){
      // initial config snapshot on connect
      config={...config,...msg.data}
      log('Config loaded')
    }
    else if(msg.type==='CONFIG_UPDATE'){
      // diff from PWA — apply only changed fields
      config={...config,...msg.data}
      log(`Config → ${Object.keys(msg.data).join(', ')}`)
    }
    else if(msg.type==='SCORE_EVENT'){
      const col=msg.colors?.primary||config.accent_color||'#ffffff'
      if(msg.reason==='THREE')scrollText='> 3 POINTER!   '
      else if(msg.reason==='LEAD_CHANGE')scrollText='> LEAD CHANGE!   '
      else if(msg.reason==='CLUTCH')scrollText='> CLUTCH TIME!   '
      else if(msg.reason==='DUNK')scrollText='> SLAM DUNK!   '
      else if(msg.reason==='BUZZER')scrollText='> BUZZER BEATER!   '
      else if(msg.reason==='STEAL')scrollText='> STEAL!   '
      else scrollText=`> ${msg.reason}!   `
      scrollX=COLS
      triggerCelebration(msg.team,col)
      log(`EVENT — ${msg.reason}${msg._source?' (test)':''}`)
    }
  }
  ws.onclose=()=>{
    statusEl.textContent='Disconnected — retrying...'
    statusEl.className='status error'
    setTimeout(connect,3000)
  }
}

connect()
