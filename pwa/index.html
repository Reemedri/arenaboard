<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>ArenaBoard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:ital,wght@0,400;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #08090D;
    color: #F5F6FA;
    font-family: -apple-system, "SF Pro Display", "Inter", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  #root { min-height: 100vh; display: flex; flex-direction: column; }
  /* Desktop phone-frame chrome — only on wide screens. On a real phone (<600px) the app fills the viewport. */
  @media (min-width: 600px) {
    body {
      background: radial-gradient(circle at 50% 30%, #14161E 0%, #08090D 60%);
      display: flex; align-items: center; justify-content: center; padding: 36px 0 24px;
    }
    #root {
      width: 390px; min-height: 0; height: 844px; max-height: calc(100vh - 60px);
      border-radius: 52px; overflow: hidden; background: #08090D;
      box-shadow: 0 0 0 11px #1A1C24, 0 0 0 12px #2E313D, 0 30px 80px rgba(0,0,0,0.6);
      position: relative;
    }
    #root::before {
      content: ''; position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
      width: 120px; height: 34px; border-radius: 20px; background: #000; z-index: 50;
    }
    #root::after {
      content: '○ PHONE · IPHONE 15 PRO'; position: absolute; top: -28px; left: 0; right: 0;
      text-align: center; font-size: 10px; letter-spacing: 2px; color: rgba(255,255,255,0.35);
      font-family: "JetBrains Mono", monospace; pointer-events: none;
    }
    .ab-statusbar { display: flex !important; }
  }
  .ab-statusbar { display: none; }
  button { font-family: inherit; }
  input[type="range"] { -webkit-appearance: none; appearance: none; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.1); outline: none; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #FF6A1A; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
  input[type="range"]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #FF6A1A; cursor: pointer; border: none; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
  ::-webkit-scrollbar { width: 0; height: 0; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  @keyframes radar-pulse { 0% { transform: scale(0.7); opacity: 0.6; } 100% { transform: scale(1.6); opacity: 0; } }
  @keyframes pop-in { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .screen-fade { animation: fade-in 280ms ease-out; }
</style>
</head>

// ─── Toast (lightweight) ────────────────────────────────────────────
function useToast() {
  const [t, setT] = React.useState(null)
  const show = (msg, kind='default') => {
    setT({ msg, kind })
    setTimeout(() => setT(null), 1800)
  }
  const node = t ? (
    <div style={{
      position: 'fixed', bottom: 86, left: '50%', transform: 'translateX(-50%)',
      background: t.kind === 'error' ? APP.danger : t.kind === 'success' ? APP.good : APP.cardElev,
      color: t.kind === 'success' || t.kind === 'error' ? '#000' : APP.text,
      padding: '10px 16px', borderRadius: 10, fontSize: 13, fontWeight: 600,
      boxShadow: '0 8px 30px rgba(0,0,0,0.5)', zIndex: 100, animation: 'fade-in 220ms ease-out',
    }}>{t.msg}</div>
  ) : null
  return [node, show]
}

// ─── Backend wiring ─────────────────────────────────────────────────
const DEVICE_UID = 'demo-device-001'
const CFG = window.ARENABOARD_CONFIG || { SERVER: 'http://localhost:3001', WS_PROTOCOL: 'ws' }
const SERVER = CFG.SERVER
const WS_URL = `${CFG.WS_PROTOCOL}://${CFG.SERVER.replace(/^https?:\/\//, '')}/?uid=${DEVICE_UID}&role=pwa`

function useBackend() {
  const [config, setConfig] = React.useState({
    brightness: 80, animation_pack: 'confetti',
    favorite_team: 'LAL', favorite_player: 'LeBron James',
    accent_color: '#FDB927',
    show_shot_clock: true, show_ticker: true, auto_follow: true,
    clock_color: '#ff5500', active_mode: 'sport_live',
    night_mode: false, auto_dim: false, orientation: 'landscape', board_res: '128x64',
  })
  const [games, setGames] = React.useState([])
  const [gamesUpdatedAt, setGamesUpdatedAt] = React.useState(0)
  const [mockActive, setMockActive] = React.useState(false)
  const [selectedGame, setSelectedGame] = React.useState(null)
  const [gameLive, setGameLive] = React.useState({ status: null, home_team: null, away_team: null, home_score: 0, away_score: 0, period: 1, clock: '12:00' })
  const [summary, setSummary] = React.useState(null)
  const [wsStatus, setWsStatus] = React.useState('connecting')
  const [momentActive, setMomentActive] = React.useState(0)
  const [toastNode, showToast] = useToast()

  const patchConfig = React.useCallback(async (changes) => {
    setConfig(c => ({ ...c, ...changes }))
    try {
      await fetch(`${SERVER}/api/device/${DEVICE_UID}/config`, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(changes),
      })
      showToast(`Synced · ${Object.keys(changes).join(', ')}`, 'success')
    } catch (e) { showToast('Server offline · local preview', 'error') }
  }, [showToast])

  const fireTrigger = React.useCallback(async (reason='DUNK') => {
    setMomentActive(20)
    setTimeout(() => setMomentActive(0), 800)
    try {
      const r = await fetch(`${SERVER}/api/device/${DEVICE_UID}/trigger`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ reason, team: 'home', accent_color: config.accent_color }),
      })
      if (!r.ok) throw new Error(`HTTP ${r.status}`)
      showToast(`Fired ${reason}`, 'success')
    } catch (e) { showToast(`Trigger failed`, 'error') }
  }, [config.accent_color, showToast])

  const selectGame = React.useCallback(async (gameId) => {
    setSelectedGame(gameId)
    try {
      await fetch(`${SERVER}/api/device/${DEVICE_UID}/active-game`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ game_id: gameId }),
      })
      showToast('Now on board', 'success')
    } catch (e) { showToast('Select failed', 'error') }
  }, [showToast])

  const loadGames = React.useCallback(async () => {
    try {
      const r = await fetch(`${SERVER}/api/games`)
      const data = await r.json()
      setGames(data.games || [])
      setGamesUpdatedAt(data.updated_at || Date.now())
      setMockActive(!!data.mock_active)
    } catch (e) { /* offline */ }
  }, [])

  // Poll the rich summary endpoint whenever a game is locked. 8s cadence — server caches at 5s so this is gentle.
  React.useEffect(() => {
    // The "active game" we want details for is either the explicitly selected one,
    // or — when nothing is locked — the first game from today's list (so the Live tab is never empty).
    const targetId = selectedGame || (games[0] && games[0].id)
    if (!targetId) { setSummary(null); return }
    let cancelled = false
    const fetchSummary = async () => {
      try {
        const r = await fetch(`${SERVER}/api/games/${targetId}/summary`)
        const data = await r.json()
        if (!cancelled) setSummary(data)
      } catch (e) { /* offline — keep last summary */ }
    }
    fetchSummary()
    const id = setInterval(fetchSummary, 8000)
    return () => { cancelled = true; clearInterval(id) }
  }, [selectedGame, games])

  React.useEffect(() => {
    fetch(`${SERVER}/api/device/${DEVICE_UID}/config`)
      .then(r => r.json())
      .then(data => { if (data.settings) setConfig(c => ({ ...c, ...data.settings })) })
      .catch(() => {})
    loadGames()
    const id = setInterval(loadGames, 10000)
    let ws, retryT
    const connect = () => {
      try {
        ws = new WebSocket(WS_URL)
        ws.onopen = () => setWsStatus('connected')
        ws.onclose = () => { setWsStatus('offline'); retryT = setTimeout(connect, 3000) }
        ws.onerror = () => {}
        ws.onmessage = (e) => {
          const msg = JSON.parse(e.data)
          if (msg.type === 'CONFIG_UPDATE' || msg.type === 'CONFIG_FULL') {
            setConfig(c => ({ ...c, ...(msg.data||{}) }))
          } else if (msg.type === 'FULL_STATE') {
            setGameLive(g => ({ ...g, ...msg.data }))
          } else if (msg.type === 'SCORE_UPDATE') {
            setGameLive(g => ({ ...g, ...msg.data }))
          } else if (msg.type === 'NO_GAMES') {
            setGameLive({ status: null, home_team: null, away_team: null, home_score: 0, away_score: 0, period: 1, clock: '12:00' })
          } else if (msg.type === 'SCORE_EVENT') {
            setMomentActive(20); setTimeout(() => setMomentActive(0), 800)
          }
        }
      } catch (e) { retryT = setTimeout(connect, 3000) }
    }
    connect()
    return () => { clearInterval(id); clearTimeout(retryT); if (ws) ws.close() }
  }, [loadGames])

  return {
    config, patchConfig, fireTrigger,
    games, gamesUpdatedAt, mockActive,
    selectedGame, selectGame,
    gameLive, wsStatus, momentActive,
    summary,
    toastNode,
  }
}

// ─── Helpers ────────────────────────────────────────────────────────
function statusLabel(g) {
  if (!g) return 'NO GAME'
  const s = g.status || ''
  if (s.includes('IN_PROGRESS')) return `Q${g.period} · ${g.clock}`
  if (s.includes('HALFTIME')) return 'HALFTIME'
  if (s.includes('FINAL')) return 'FINAL'
  if (s.includes('SCHEDULED') || s.includes('PRE')) return g.status_detail || 'SCHEDULED'
  if (s.includes('END_PERIOD')) return `END Q${g.period}`
  return s.replace('STATUS_', '').replace(/_/g, ' ')
}
function isLive(g) { return g && g.status && g.status.includes('IN_PROGRESS') }
function isFinal(g) { return g && g.status && g.status.includes('FINAL') }

  NYK:'#F58426', CHI:'#CE1141', PHI:'#006BB6', MIL:'#00471B',
  DEN:'#0E2240', PHX:'#E56020', DAL:'#0053BC', LAC:'#C8102E',
  ATL:'#E03A3E', BKN:'#000000', CHA:'#1D1160', CLE:'#860038',
  DET:'#1D42BA', HOU:'#CE1141', IND:'#FDBB30', MEM:'#5D76A9',
  MIN:'#236192', NOP:'#0C2340', OKC:'#007AC1', ORL:'#0077C0',
  POR:'#E03A3E', SAC:'#5A2D81', SAS:'#C4CED4', TOR:'#CE1141',
  UTA:'#002B5C', WAS:'#002B5C',

const teamTint = (abbr) => TEAM_COLORS[abbr] || APP.accent

// ─── LIVE screen ────────────────────────────────────────────────────
function LiveScreen({ backend, onChangeGame }) {
  const { gameLive, momentActive, fireTrigger, summary, games, selectedGame } = backend
  // Prefer the rich summary feed; fall back to whatever's broadcast over WS.
  const s = summary && !summary.error ? summary : null
  const homeAbbr = s?.home?.abbr || gameLive.home_team || (games[0] && games[0].home_team)
  const awayAbbr = s?.away?.abbr || gameLive.away_team || (games[0] && games[0].away_team)
  const homeName = s?.home?.name || homeAbbr || 'Home'
  const awayName = s?.away?.name || awayAbbr || 'Away'
  const homeColor = (s?.home?.color) || teamTint(homeAbbr)
  const awayColor = (s?.away?.color) || teamTint(awayAbbr)
  const homeScore = s?.home?.score ?? gameLive.home_score ?? 0
  const awayScore = s?.away?.score ?? gameLive.away_score ?? 0
  const homeLines = s?.home?.linescores || []
  const awayLines = s?.away?.linescores || []
  const live = (s && s.status?.includes('IN_PROGRESS')) || isLive(gameLive)
  const final = (s && s.status?.includes('FINAL')) || isFinal(gameLive)
  const statusText = s?.status_detail || statusLabel(gameLive)

  const watching = homeAbbr && awayAbbr ? `${homeAbbr} vs ${awayAbbr}` : 'Pick a game'

  return (
    <div className="screen-fade" style={{ padding: '0 16px 16px', flex: 1, display: 'flex', flexDirection: 'column', gap: 12 }}>
      {/* Now-watching pill */}
      <div style={{
        padding: '10px 12px', borderRadius: 14,
        background: 'rgba(255,255,255,0.04)', border: `1px solid ${APP.line}`,
        display: 'flex', alignItems: 'center', gap: 10,
      }}>
        <TeamPair home={homeAbbr} away={awayAbbr} homeColor={homeColor} awayColor={awayColor} small />
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: 9, fontWeight: 800, letterSpacing: 1.8, color: APP.textMuted }}>NOW WATCHING</div>
          <div style={{ fontSize: 14, fontWeight: 700, color: APP.text, marginTop: 1, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{watching}</div>
        </div>
        <button onClick={onChangeGame} style={{
          padding: '6px 12px', borderRadius: 999, border: 'none',
          background: 'rgba(255,255,255,0.08)', color: APP.accent,
          fontSize: 12, fontWeight: 700, cursor: 'pointer',
          display: 'flex', alignItems: 'center', gap: 4, fontFamily: TYPE.sans,
        }}>Change {Icon.chev(APP.accent)}</button>
      </div>

      {/* Pregame / live / final card */}
      <div style={{
        position: 'relative', borderRadius: 22, overflow: 'hidden',
        background: `linear-gradient(135deg, ${homeColor}1F 0%, ${APP.card} 50%, ${awayColor}1F 100%)`,
        border: `1px solid ${APP.lineBold}`, padding: '14px 16px 16px',
      }}>
        {/* Status header inside card */}
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8 }}>
          {live
            ? <LiveChip>LIVE · {statusText}</LiveChip>
            : final
              ? <Pill color={APP.textMuted}>FINAL</Pill>
              : <Pill color={APP.accent2}>{statusText.toUpperCase()}</Pill>}
          {momentActive > 0 && <Pill color={APP.gold} bg={`${APP.gold}30`}>MOMENT</Pill>}
        </div>

        {/* Teams + scores row */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginTop: 14 }}>
          <TeamSide abbr={homeAbbr} name={homeName} role="Home" color={homeColor} score={homeScore} showScore={live || final} align="left" />
          <div style={{ minWidth: 38, textAlign: 'center' }}>
            <div style={{ fontSize: 11, fontFamily: TYPE.mono, color: APP.textMuted, letterSpacing: 1.5 }}>VS</div>
          </div>
          <TeamSide abbr={awayAbbr} name={awayName} role="Away" color={awayColor} score={awayScore} showScore={live || final} align="right" />
        </div>

        {/* Score-by-quarter bars */}
        <div style={{ marginTop: 14, display: 'flex', justifyContent: 'space-between', gap: 18 }}>
          <QuarterBars scores={homeLines.length ? homeLines : [0,0,0,0]} color={homeColor} align="left" />
          <QuarterBars scores={awayLines.length ? awayLines : [0,0,0,0]} color={awayColor} align="right" />
        </div>
      </div>

      {/* Player highlight card */}
      {s && s.leaders && s.leaders[0] ? <LeaderCard leader={s.leaders[0]} accentColor={APP.accent} /> : null}

      {/* Play-by-play */}
      <div style={{ display: 'flex', flexDirection: 'column', gap: 8, marginTop: 4 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <div style={{ fontSize: 10, letterSpacing: 1.6, fontWeight: 800, color: APP.textMuted }}>PLAY-BY-PLAY</div>
          <div style={{ flex: 1, height: 1, background: APP.line }} />
        </div>
        <PlayByPlay plays={s?.plays} fallbackHomeColor={homeColor} fallbackAwayColor={awayColor} />
      </div>

      {/* Big test button (the design's CTA) — fires DUNK trigger to the board */}
      <button onClick={() => fireTrigger('DUNK')} style={{
        marginTop: 6,
        padding: '16px 18px', borderRadius: 18, border: 'none', cursor: 'pointer',
        background: `linear-gradient(135deg, ${APP.accent} 0%, #FF8A3D 100%)`,
        color: '#0B0C10', fontSize: 14, fontWeight: 800, letterSpacing: 1.4, textTransform: 'uppercase',
        fontFamily: TYPE.sans, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8,
        boxShadow: `0 6px 20px ${APP.accent}40`,
      }}>
        {Icon.bolt('#0B0C10')} Test Moment of Impact
      </button>
    </div>
  )
}

// Two stacked logo circles, slightly overlapped — used in the now-watching pill.
function TeamPair({ home, away, homeColor, awayColor, small }) {
  const sz = small ? 28 : 40
  return (
    <div style={{ display: 'flex', alignItems: 'center' }}>
      <LogoCircle abbr={home} color={homeColor} size={sz} />
      <div style={{ marginLeft: -10 }}><LogoCircle abbr={away} color={awayColor} size={sz} /></div>
    </div>
  )
}

function LogoCircle({ abbr, color, size = 48 }) {
  return (
    <div style={{
      width: size, height: size, borderRadius: size / 2,
      background: color || APP.card,
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      color: '#fff', fontWeight: 900, fontSize: size * 0.32,
      letterSpacing: -0.3, fontFamily: TYPE.sans,
      border: `2px solid rgba(255,255,255,0.1)`,
      boxShadow: `0 4px 14px ${color || '#000'}40`,
      flexShrink: 0,
    }}>{abbr || '—'}</div>
  )
}

function TeamSide({ abbr, name, role, color, score, showScore, align }) {
  return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: align === 'right' ? 'flex-end' : 'flex-start', minWidth: 0 }}>
      <LogoCircle abbr={abbr} color={color} />
      <div style={{ marginTop: 8, fontSize: 11, fontWeight: 800, color: APP.text, letterSpacing: 0.2, textAlign: align }}>{name}</div>
      <div style={{ fontSize: 9, color: APP.textMuted, letterSpacing: 1.5, marginTop: 2, fontFamily: TYPE.mono }}>{role.toUpperCase()}</div>
      {showScore && (
        <div style={{ fontSize: 36, fontWeight: 900, color: APP.text, fontFamily: TYPE.display, lineHeight: 1, marginTop: 6, letterSpacing: -1 }}>{score}</div>
      )}
    </div>
  )
}

function QuarterBars({ scores, color, align }) {
  // Show up to 4 segments; values normalized so the tallest cap caps at full bar height.
  const visible = scores.slice(0, 4)
  const max = Math.max(1, ...visible)
  return (
    <div style={{ display: 'flex', gap: 4, alignItems: 'flex-end', flexDirection: align === 'right' ? 'row-reverse' : 'row' }}>
      {[0,1,2,3].map(i => {
        const v = visible[i] ?? 0
        const pct = max > 0 ? (v / max) * 100 : 0
        const filled = v > 0
        return (
          <div key={i} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4 }}>
            <div style={{ width: 28, height: 4, borderRadius: 2, background: filled ? color : 'rgba(255,255,255,0.08)', opacity: filled ? 0.95 : 1 }} />
            <div style={{ fontSize: 10, fontWeight: 700, color: filled ? color : APP.textDim, fontFamily: TYPE.mono }}>{v || '–'}</div>
          </div>
        )
      })}
    </div>
  )
}

function LeaderCard({ leader, accentColor }) {
  const stats = (leader.line || '').split(',').map(s => s.trim()).filter(Boolean)
  return (
    <div style={{
      padding: '12px 14px', borderRadius: 16,
      background: `linear-gradient(90deg, ${accentColor}26 0%, ${APP.card} 100%)`,
      border: `1px solid ${APP.line}`, display: 'flex', alignItems: 'center', gap: 12,
    }}>
      <div style={{
        width: 42, height: 42, borderRadius: 21, background: accentColor, color: '#0B0C10',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        fontWeight: 900, fontSize: 14, fontFamily: TYPE.display, flexShrink: 0,
      }}>{leader.jersey || '★'}</div>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 14, fontWeight: 800, color: APP.text, display: 'flex', alignItems: 'center', gap: 6 }}>
          {leader.name || 'Top performer'} <span style={{ fontSize: 12 }}>🔥</span>
        </div>
        <div style={{ fontSize: 11, color: APP.textMuted, marginTop: 2, fontFamily: TYPE.mono, letterSpacing: 0.4 }}>
          {leader.team || ''}{leader.position ? ` · ${leader.position}` : ''}{stats.length ? ` · ${stats.slice(0,3).join(' · ')}` : ''}
        </div>
      </div>
    </div>
  )
}

function PlayByPlay({ plays, fallbackHomeColor, fallbackAwayColor }) {
  if (!plays || plays.length === 0) {
    return (
      <div style={{ padding: '18px 14px', borderRadius: 14, background: APP.card, border: `1px solid ${APP.line}`, fontSize: 12, color: APP.textMuted, textAlign: 'center', fontFamily: TYPE.mono, letterSpacing: 1.2 }}>
        FEED LIGHTS UP AT TIPOFF
      </div>
    )
  }
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
      {plays.slice(0, 5).map((p, i) => {
        const tag = playTag(p)
        const tint = tag.tint || (i % 2 === 0 ? fallbackHomeColor : fallbackAwayColor)
        return (
          <div key={p.id || i} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '8px 4px' }}>
            <div style={{ minWidth: 38, textAlign: 'left' }}>
              <div style={{ fontSize: 9, color: APP.textDim, fontFamily: TYPE.mono, fontWeight: 700 }}>Q{p.period}</div>
              <div style={{ fontSize: 13, color: APP.text, fontWeight: 800, fontFamily: TYPE.mono, letterSpacing: -0.3 }}>{p.clock || '—'}</div>
            </div>
            <div style={{ width: 3, height: 30, borderRadius: 2, background: tint, opacity: 0.85, flexShrink: 0 }} />
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                <Pill color={tag.tint} bg={`${tag.tint}25`}>{tag.label}</Pill>
              </div>
              <div style={{ fontSize: 12, color: APP.textMuted, marginTop: 3, lineHeight: 1.3, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{p.text}</div>
            </div>
          </div>
        )
      })}
    </div>
  )
}

function playTag(p) {
  const t = (p.text || '').toLowerCase()
  if (p.score_value === 3) return { label: '3PT',  tint: APP.accent2 }
  if (t.includes('dunk'))   return { label: 'DUNK', tint: APP.accent }
  if (t.includes('block'))  return { label: 'BLK',  tint: '#A569FF' }
  if (t.includes('steal'))  return { label: 'STL',  tint: APP.good }
  if (t.includes('foul'))   return { label: 'FOUL', tint: APP.danger }
  if (t.includes('assist')) return { label: 'AST',  tint: APP.gold }
  if (t.includes('rebound'))return { label: 'REB',  tint: APP.textMuted }
  if (p.scoring)            return { label: '2PT',  tint: APP.accent2 }
  return { label: (p.type || 'PLAY').toUpperCase().slice(0, 4), tint: APP.textMuted }
}

// ─── GAMES screen ──────────────────────────────────────────────────
function GamesScreen({ backend }) {
  const { games, selectedGame, selectGame, gamesUpdatedAt, mockActive } = backend
  const [filter, setFilter] = React.useState('all')
  const [now, setNow] = React.useState(Date.now())
  React.useEffect(() => { const id = setInterval(() => setNow(Date.now()), 30000); return () => clearInterval(id) }, [])
  const sec = Math.max(0, Math.round((now - gamesUpdatedAt) / 1000))

  const filtered = games.filter(g => {
    if (filter === 'live') return isLive(g)
    if (filter === 'final') return isFinal(g)
    return true
  })

  return (
    <div className="screen-fade" style={{ padding: '0 16px 16px', flex: 1, display: 'flex', flexDirection: 'column', gap: 12 }}>
      <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
        {['all','live','final'].map(f => (
          <button key={f} onClick={() => setFilter(f)} style={{
            padding: '7px 14px', borderRadius: 999, border: 'none',
            background: filter === f ? APP.text : 'rgba(255,255,255,0.05)',
            color: filter === f ? '#000' : APP.textMuted,
            fontSize: 11, fontWeight: 700, letterSpacing: 0.5, textTransform: 'uppercase',
            cursor: 'pointer', fontFamily: TYPE.sans,
          }}>{f}</button>
        ))}
        <div style={{ flex: 1 }} />
        <div style={{ fontSize: 10, color: APP.textDim, fontFamily: TYPE.mono, letterSpacing: 1 }}>
          {mockActive ? 'MOCK · ' : ''}{sec}s ago
        </div>
      </div>

      {filtered.length === 0 ? (
        <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column', gap: 8, color: APP.textMuted }}>
          <div style={{ fontSize: 14, fontFamily: TYPE.display, fontStyle: 'italic' }}>No games match.</div>
          <div style={{ fontSize: 11, letterSpacing: 1, fontFamily: TYPE.mono }}>SCHEDULE LOADS HOURLY</div>
        </div>
      ) : (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          {filtered.map(g => {
            const live = isLive(g)
            const sel = selectedGame === g.id
            const homeT = teamTint(g.home_team), awayT = teamTint(g.away_team)
            return (
              <button key={g.id} onClick={() => selectGame(g.id)} style={{
                textAlign: 'left', padding: '14px 14px', borderRadius: 14,
                background: sel ? `linear-gradient(90deg, ${APP.accent}25, ${APP.card})` : APP.card,
                border: sel ? `1px solid ${APP.accent}` : `1px solid ${APP.line}`,
                cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 12, fontFamily: TYPE.sans,
                color: APP.text,
              }}>
                <div style={{ minWidth: 56 }}>
                  {live ? <LiveChip>LIVE</LiveChip> : isFinal(g) ? <Pill color={APP.textMuted}>FINAL</Pill> : <Pill color={APP.accent2}>SCHED</Pill>}
                </div>
                <div style={{ flex: 1, display: 'flex', alignItems: 'center', gap: 8 }}>
                  <LogoCircle abbr={g.away_team} color={awayT} size={28} />
                  <TeamLine abbr={g.away_team} score={g.away_score} tint={awayT} winner={g.away_score > g.home_score && isFinal(g)} />
                  <div style={{ fontSize: 10, color: APP.textDim, fontFamily: TYPE.mono }}>@</div>
                  <LogoCircle abbr={g.home_team} color={homeT} size={28} />
                  <TeamLine abbr={g.home_team} score={g.home_score} tint={homeT} winner={g.home_score > g.away_score && isFinal(g)} />
                </div>
                <div style={{ minWidth: 60, textAlign: 'right' }}>
                  <div style={{ fontSize: 11, color: APP.textMuted, fontFamily: TYPE.mono }}>{statusLabel(g)}</div>
                  {sel && <div style={{ fontSize: 9, color: APP.accent, fontWeight: 800, letterSpacing: 1.5, marginTop: 3 }}>ON BOARD</div>}
                </div>
              </button>
            )
          })}
        </div>
      )}
    </div>
  )
}

function TeamLine({ abbr, score, tint, winner }) {
  return (
    <div style={{ display: 'flex', alignItems: 'baseline', gap: 6 }}>
      <div style={{ fontSize: 14, fontWeight: 800, color: tint, letterSpacing: -0.2 }}>{abbr}</div>
      <div style={{ fontSize: 17, fontWeight: 800, color: winner ? APP.text : APP.textMuted, fontFamily: TYPE.display, lineHeight: 1 }}>{score ?? 0}</div>
    </div>
  )
}

// ─── App root ───────────────────────────────────────────────────────
function App() {
  const backend = useBackend()
  const [tab, setTab] = React.useState('live')

  const titles = {
    live:    { title: 'Live',    sub: 'NOW PLAYING' },
    games:   { title: 'Games',   sub: 'TODAY' },
    market:  { title: 'Market',  sub: 'COMING SOON' },
    fun:     { title: 'Fun',     sub: 'COMING SOON' },
    display: { title: 'Display', sub: 'BOARD SETTINGS' },
  }
  const t = titles[tab]

  return (
    <React.Fragment>
      <DeviceTopBar onOpenSettings={() => setTab('display')} wsStatus={backend.wsStatus} />
      <AppHeader title={t.title} sub={t.sub} />
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflowY: 'auto' }}>
        {tab === 'live'    && <LiveScreen    backend={backend} onChangeGame={() => setTab('games')} />}
        {tab === 'games'   && <GamesScreen   backend={backend} />}
        {tab === 'display' && <DisplayScreen backend={backend} />}
        {tab === 'market'  && <PreviewScreen title="Skin marketplace" blurb="Buy team skins, season packs, and signature animations from your favorite players. Backend purchase flow + content delivery ships next sprint." />}
        {tab === 'fun'     && <PreviewScreen title="Buzzer trivia" blurb="Tap-to-answer multiplayer trivia that takes over the board between quarters. Real-time room state ships with the multiplayer sprint." />}
      </div>
      <BottomTabs active={tab} onSelect={setTab} />
      {backend.toastNode}
    </React.Fragment>
  )
}

const root = ReactDOM.createRoot(document.getElementById('root'))
root.render(<App />)
</script>
</body>
</html>
